name: build-ghcr

on:
  push:
    branches: [Alpha]
    paths:
      - 'Dockerfile.era'
      - '.github/workflows/build-ghcr.yml'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Alpha
      - id: meta
        run: echo "sha8=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.era
          push: true
          tags: |
            ghcr.io/era-cloud/mihomo:latest
            ghcr.io/era-cloud/mihomo:alpha-${{ steps.meta.outputs.sha8 }}
          build-args: |
            VERSION=era-${{ steps.meta.outputs.sha8 }}
