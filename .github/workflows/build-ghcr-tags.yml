name: build-ghcr-tags

# 每 6 小时：同步上游 tags 到本 fork → 解析最新 release tag → 有变化才构建
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream tags to fork
        run: |
          git remote add upstream https://github.com/MetaCubeX/mihomo.git
          git fetch --tags --force upstream
          git push --tags --force origin || echo "tag push had conflicts (ignored)"

      - name: Resolve latest release tag
        id: tag
        run: |
          TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest=$TAG"

      - name: Detect change
        id: chk
        run: |
          prev=$(cat BUILT_TAG 2>/dev/null || echo "")
          now="${{ steps.tag.outputs.tag }}"
          if [ -n "$now" ] && [ "$now" = "$prev" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag + prepare Dockerfile
        if: steps.chk.outputs.changed == 'true'
        run: |
          git checkout "${{ steps.tag.outputs.tag }}"
          cat > Dockerfile.era <<'DOCKER'
          FROM golang:alpine AS build
          WORKDIR /src
          COPY . .
          ARG VERSION=era-unknown
          RUN CGO_ENABLED=0 go build -tags with_gvisor -trimpath \
                -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -w -s -buildid=" \
                -o /out/mihomo .
          FROM alpine:latest
          RUN apk add --no-cache ca-certificates tzdata iptables
          COPY --from=build /out/mihomo /mihomo
          ENTRYPOINT ["/mihomo"]
          DOCKER

      - uses: docker/setup-buildx-action@v3
        if: steps.chk.outputs.changed == 'true'
      - uses: docker/login-action@v3
        if: steps.chk.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.chk.outputs.changed == 'true'
        with:
          context: .
          file: Dockerfile.era
          push: true
          build-args: |
            VERSION=era-${{ steps.tag.outputs.tag }}
          tags: |
            ghcr.io/era-cloud/mihomo:latest
            ghcr.io/era-cloud/mihomo:${{ steps.tag.outputs.tag }}

      - name: Record built tag
        if: steps.chk.outputs.changed == 'true'
        run: |
          if [ "$(cat BUILT_TAG 2>/dev/null)" = "${{ steps.tag.outputs.tag }}" ]; then
            echo "BUILT_TAG 未变（手动重建），跳过提交"; exit 0
          fi
          git checkout main
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          echo "${{ steps.tag.outputs.tag }}" > BUILT_TAG
          git add BUILT_TAG
          git commit -m "chore: mihomo ${{ steps.tag.outputs.tag }} [skip ci]"
          git push
